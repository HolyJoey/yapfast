# A release of this fork, made by pushing a tag such as v0.3.0-dl.1: the
# upstream version it's based on, then -dl. and this fork's release number.
# It builds the Linux AppImage, the Arch package and the Windows ZIP on
# GitHub's runners, as upstream's nightly does (docs/packaging.md), and
# publishes them with their checksums and the source.
name: Release

on:
  push:
    tags: ["v*-dl.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          # Nix refuses a shallow Git repository as a flake.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - run: scripts/set-version "${{ needs.version.outputs.version }}"
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - run: scripts/build-appimage
      # The AppImage's binary as an Arch package, in an Arch container.
      - run: scripts/package-arch
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/dist/linux/Yapfast-*
            target/dist/linux/yapfast-*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # Skia built for Windows, and the MSVC CRT and SDK it was built against,
      # which nix/prepare-windows-skia.py checks before reusing it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/set-version "${{ needs.version.outputs.version }}"
      # Wine doesn't start on the runner (kernel32.dll, c0000135), so Inno
      # Setup can't make the installer there: Windows gets the portable ZIP.
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/discord/Yapfast-*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        run: |
          set -o pipefail
          # Both jobs zip the commit's source; SOURCE.txt and each BUILD.json
          # name the one file the release carries.
          cmp "dist/linux/Yapfast-$VERSION-source.zip" "dist/windows/Yapfast-$VERSION-source.zip"
          mkdir release
          mv dist/linux/Yapfast-* dist/linux/yapfast-*.pkg.tar.zst release/
          mv dist/windows/Yapfast-*-windows-x64* release/
          (cd release && sha256sum Yapfast-* yapfast-*.pkg.tar.zst > SHA256SUMS.txt)
          upstream="${VERSION%%-dl.*}"
          {
            echo "Yapfast $VERSION: upstream Yapfast v$upstream with this fork's changes (see the README). Unofficial; not made or supported by Yapfast's or Discord's developers."
            echo
            echo "- **Linux** (Debian 13, Ubuntu 24.04, Fedora 40 and newer): the \`.AppImage\`. \`chmod +x\` it and run it."
            echo "- **Arch Linux**: \`sudo pacman -U\` the \`.pkg.tar.zst\`."
            echo "- **Windows 10 and 11** (beta): unzip the \`windows-x64\` ZIP and run \`yapfast.exe\`."
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS.txt --ignore-missing\`. The source is the \`source.zip\`."
          } > notes.md
          gh release create "v$VERSION" release/* --target "$COMMIT" \
            --title "Yapfast $VERSION" --notes-file notes.md
